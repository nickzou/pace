# Per-environment stack — its OWN Postgres + powersync-storage + api + powersync
# + web. Fully isolated: all state lives here, so teardown is `compose down -v`
# with nothing shared to clean up. One template, many instances — every value
# comes from a generated env file (deploy/bin/render-env.sh), the project name
# (${STACK}) isolates the container set + its volumes, and the stack joins the
# shared platform only for edge routing. Brought up by deploy/bin/up.sh <env>.
#
# Networks:
#   default  — this env's PRIVATE network (per compose project). All internal
#              traffic (api/powersync → postgres, powersync → api for JWKS) uses
#              it, so plain service names resolve unambiguously per env.
#   pace-net — the shared platform network. ONLY the edge services join it, so
#              Traefik can reach them. They also get a ${STACK}-prefixed alias
#              there: the generic name (`api`) is ambiguous across envs on a
#              shared network, so powersync targets the unique ${STACK}-api.
#
# Routing is single-host + path-based (one hostname per env → wildcard cert):
#   /          -> web       /api -> api       /powersync -> powersync

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    # wal_level=logical so PowerSync can replicate this env's tasks off the WAL.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pace
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pace"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync-storage:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: powersync
    volumes:
      - storagedata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d powersync"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies drizzle migrations to this env's Postgres, then exits.
  # Profiled so a normal `up` skips it; up.sh runs it explicitly between bringing
  # the DB up and starting the app (see deploy/bin/up.sh).
  migrate:
    image: ${IMAGE_API_MIGRATE}
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: seeds a known-password test user into NON-prod envs (idempotent),
  # then exits. Profiled so a normal `up` skips it; up.sh runs it explicitly after
  # migrations, for previews only (never prod). Needs the auth env vars because it
  # creates the user through Better Auth (auth.api.signUpEmail), not raw SQL.
  seed:
    image: ${IMAGE_API_SEED}
    profiles: ["seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_API}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
    networks:
      default: {}
      pace-net:
        # Globally-unique alias so powersync reaches *this* env's API for JWKS
        # (the generic `api` is ambiguous across envs on the shared network).
        aliases:
          - ${STACK}-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK}-api.rule=Host(`${HOST}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.${STACK}-api.entrypoints=websecure"
      - "traefik.http.routers.${STACK}-api.tls=true"
      - "traefik.http.services.${STACK}-api.loadbalancer.server.port=3001"

  powersync:
    image: ${POWERSYNC_IMAGE}
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      postgres:
        condition: service_healthy
      powersync-storage:
        condition: service_healthy
    volumes:
      - ../../powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI}
      PS_JWKS_URL: ${PS_JWKS_URL}
      PS_PORT: "8080"
    networks:
      - default
      - pace-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK}-sync.rule=Host(`${HOST}`) && PathPrefix(`/powersync`)"
      - "traefik.http.routers.${STACK}-sync.entrypoints=websecure"
      - "traefik.http.routers.${STACK}-sync.tls=true"
      # Strip /powersync so the service sees its own root paths (/sync/stream, …).
      - "traefik.http.routers.${STACK}-sync.middlewares=${STACK}-sync-strip"
      - "traefik.http.middlewares.${STACK}-sync-strip.stripprefix.prefixes=/powersync"
      - "traefik.http.services.${STACK}-sync.loadbalancer.server.port=8080"

  web:
    image: ${IMAGE_WEB}
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Browser-facing URLs injected into the SSR HTML at runtime (getConfig()).
      API_URL: ${API_URL}
      POWERSYNC_URL: ${POWERSYNC_URL}
    networks:
      - default
      - pace-net
    labels:
      - "traefik.enable=true"
      # Host-only rule — lower priority than /api and /powersync above, so it
      # catches everything else for this host.
      - "traefik.http.routers.${STACK}-web.rule=Host(`${HOST}`)"
      - "traefik.http.routers.${STACK}-web.entrypoints=websecure"
      - "traefik.http.routers.${STACK}-web.tls=true"
      - "traefik.http.services.${STACK}-web.loadbalancer.server.port=3000"

networks:
  # This env's private network — created per compose project (${STACK}_default).
  default:
  # The shared platform network (created by deploy/platform).
  pace-net:
    external: true
    name: pace-net

volumes:
  pgdata:
  storagedata:

name: pace

services:
  # Edge reverse proxy: terminates TLS (Cloudflare Origin cert) and routes to
  # app containers by their Docker labels. This is the piece that will later
  # route staging / ephemeral environments automatically.
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - web

  # The Pace web app (SSR). Not published to the host — only Traefik reaches it,
  # over the internal network, on port 3000.
  app:
    image: ${IMAGE:-ghcr.io/nickzou/pace/web:latest}
    restart: unless-stopped
    environment:
      - PORT=3000
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pace.rule=Host(`paceproductivity.app`)"
      - "traefik.http.routers.pace.entrypoints=websecure"
      - "traefik.http.routers.pace.tls=true"
      - "traefik.http.services.pace.loadbalancer.server.port=3000"

networks:
  web:

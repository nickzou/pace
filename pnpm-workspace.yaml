packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
  - "desktop-e2e"

# Which dependencies may run install/build scripts (pnpm blocks all by default).
# true = build it, false = skip without prompting. Every dependency that ships a
# build script must be listed, or `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS.
#   esbuild / lightningcss — native binaries Vite/Tailwind/drizzle-kit need.
#   @prisma/client / better-sqlite3 — unused adapters pulled in transitively by
#     drizzle-kit / better-auth's CLI (we're on postgres.js); skip their heavy
#     native builds.
allowBuilds:
  esbuild: true
  lightningcss: true
  "@prisma/client": false
  better-sqlite3: false
  # WebdriverIO (desktop e2e) pulls these Edge/Firefox drivers transitively; the
  # Tauri suite uses WebKitWebDriver, so skip their browser-driver downloads.
  edgedriver: false
  geckodriver: false

minimumReleaseAgeExclude:
  - expo-constants@57.0.9
  - expo-linking@57.0.5

# Force a single React across the workspace. The release-age policy handed
# @pace/api-client an older react than apps/web, so @trpc/tanstack-react-query
# bound to a *second* React copy — crashing SSR with "Invalid hook call". One
# version means one copy.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

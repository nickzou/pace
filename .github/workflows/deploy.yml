name: Deploy

on:
  # Run the checks on every branch push (fast feedback before a PR exists)…
  push:
    branches: ["**"]
  # …and on PRs into main — open/update build the PR's preview env, close tears
  # it down (see deploy-preview / teardown-preview).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Don't let two deploys race; a newer push supersedes an in-flight one. On PRs
# github.ref is refs/pull/<n>/merge, so this also isolates previews per PR.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: bad code never reaches the build/deploy jobs.
  check:
    # PR-close events only tear a preview down — no need to re-run the checks.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm turbo typecheck # api + web + mobile
      - name: Biome check
        run: pnpm exec biome check .

  # Unit + integration tests (Vitest): the tasks tRPC API against a real
  # Postgres, plus the shared Zod schemas. Fast — no browsers.
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pace
          POSTGRES_PASSWORD: pace
          POSTGRES_DB: pace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # No .env in CI — the vitest setup derives pace_test from DATABASE_URL and
      # creates + migrates it. env.ts requires these three.
      DATABASE_URL: postgresql://pace:pace@localhost:5432/pace
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        # Fast unit + integration tests (Vitest). @pace/web and @pace/mobile expose
        # a `test` script for their pure helpers; the browser/emulator e2e suites
        # (@pace/e2e, mobile's test:e2e) run in their own jobs/workflows.
        run: pnpm turbo test --filter=@pace/api --filter=@pace/validation --filter=@pace/web --filter=@pace/mobile

  # End-to-end tasks/auth flow (web → API → Postgres, synced via PowerSync) in a
  # real browser. The e2e infra — Postgres (wal_level=logical) + a PowerSync
  # service + bucket storage — is the docker-compose.e2e.yml stack that
  # global-setup.ts brings up (a plain service container can't set wal_level).
  # Ports / URLs live in playwright.config.ts.
  e2e:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      # The API server needs its auth secret from the environment (no .env in CI);
      # the DB URL + PowerSync URL are set per-server in playwright.config.ts.
      BETTER_AUTH_SECRET: ci-e2e-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @pace/e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter @pace/e2e test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # Prod now runs on the shared platform + the per-env stack (deploy/stack) — the
  # SAME machinery every pr-<n> preview uses, just with env name "prod" (apex
  # host). This replaces the legacy web-only compose (traefik + a single `app`
  # container). Legacy prod had no database, so there is no data to migrate: the
  # first run just retires the old stack and stands prod up fresh on the new one.
  deploy:
    needs: [check, test, e2e]
    # Deploy ONLY on pushes that land on main. Every feature branch and PR runs
    # the checks above but never deploys. Prod stays continuous-deploy on merge;
    # the PR previews are the pre-merge gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    env:
      REG: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The full stack needs three images (the old web-only prod built just web).
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REG }}/web:${{ github.sha }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: runtime
          push: true
          tags: ${{ env.REG }}/api:${{ github.sha }}

      - name: Build and push api-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: migrate
          push: true
          tags: ${{ env.REG }}/api-migrate:${{ github.sha }}

      - name: Deploy prod over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          # Must be the *wildcard* origin cert (*.paceproductivity.app + apex) so
          # the apex (prod) AND every pr-<n>.* preview are covered by one cert.
          ORIGIN_CERT: ${{ secrets.ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.ORIGIN_KEY }}
          BASE_DOMAIN: paceproductivity.app
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.PROD_BETTER_AUTH_SECRET }}
          SHA: ${{ github.sha }}
          REG: ghcr.io/${{ github.repository }}
        run: |
          set -e

          # SSH key + pin the host key
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key deploy@$DEPLOY_HOST"

          # Ship the deploy machinery + PowerSync config to the box. up.sh runs ON
          # the box against deploy/stack; that stack mounts ../../powersync for the
          # PowerSync service config, so both trees must be present. tar keeps the
          # scripts' +x bits.
          tar czf - deploy powersync | $SSH "mkdir -p pace && tar xzf - -C pace"

          # Wildcard origin cert/key from secrets → pace/deploy/certs, where the
          # platform compose mounts them (../certs:/certs) and tls.yml serves the
          # pair as Traefik's default cert for every env host.
          printf '%s\n' "$ORIGIN_CERT" | $SSH "mkdir -p pace/deploy/certs && cat > pace/deploy/certs/origin.pem"
          printf '%s\n' "$ORIGIN_KEY"  | $SSH "cat > pace/deploy/certs/origin-key.pem && chmod 600 pace/deploy/certs/origin-key.pem"

          # Retire the legacy web-only stack (compose project "pace": its private
          # Traefik + `app`). It binds :80/:443, so it MUST come down before the
          # shared platform Traefik can bind them. Idempotent — a no-op once gone.
          $SSH "cd pace \
            && (docker compose -p pace down --remove-orphans 2>/dev/null || true) \
            && (docker rm -f pace-traefik-1 pace-app-1 pace-web 2>/dev/null || true) \
            && rm -f docker-compose.yml"

          # Bring up the stateless shared platform (idempotent), then prod on the
          # new per-env stack with this commit's images.
          $SSH "cd pace \
            && echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin \
            && docker compose -f deploy/platform/docker-compose.yml up -d \
            && BASE_DOMAIN='$BASE_DOMAIN' \
               IMAGE_WEB='$REG/web:$SHA' \
               IMAGE_API='$REG/api:$SHA' \
               IMAGE_API_MIGRATE='$REG/api-migrate:$SHA' \
               POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
               BETTER_AUTH_SECRET='$BETTER_AUTH_SECRET' \
               bash deploy/bin/up.sh prod \
            && docker image prune -f"

  # Ephemeral per-PR preview: the SAME stack prod runs, keyed by env name
  # "pr-<n>" → pr-<n>.paceproductivity.app. Comes up on PR open/update; gated on
  # check + test only (not e2e) so it appears fast. Fork PRs get no preview —
  # GitHub withholds secrets from pull_request runs on forks, by design.
  deploy-preview:
    needs: [check, test]
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
      pull-requests: write # comment the preview URL
    env:
      REG: ghcr.io/${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Build the PR branch's actual tip so the image matches the SHA we tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REG }}/web:${{ env.SHA }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: runtime
          push: true
          tags: ${{ env.REG }}/api:${{ env.SHA }}

      - name: Build and push api-migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: migrate
          push: true
          tags: ${{ env.REG }}/api-migrate:${{ env.SHA }}

      - name: Build and push api-seed
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: seed
          push: true
          tags: ${{ env.REG }}/api-seed:${{ env.SHA }}

      - name: Deploy preview over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          BASE_DOMAIN: paceproductivity.app
          # Optional hardening: if set, previews use these; unset → render-env.sh
          # falls back to throwaway defaults (fine — Postgres isn't edge-exposed).
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          # Shared htpasswd credential gating the preview's web UI (soft gate so
          # stray users can't browse it). Unset → preview comes up ungated.
          BASIC_AUTH_USERS: ${{ secrets.PREVIEW_BASIC_AUTH }}
          REG: ghcr.io/${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key deploy@$DEPLOY_HOST"

          # Ship this PR's deploy machinery + PowerSync config (a PR may change the
          # per-env stack or scripts). gitignored deploy/certs isn't in the tree,
          # so the box's cert is untouched. The shared platform (Traefik + cert +
          # pace-net) is owned by prod deploys and already up (restart:
          # unless-stopped survives reboots) — previews never touch it, so a PR
          # can't disturb prod or other previews' edge routing.
          tar czf - deploy powersync | $SSH "mkdir -p pace && tar xzf - -C pace"

          # Bring up ONLY this PR's stack, attaching to the existing platform net.
          $SSH "cd pace \
            && echo '$REGISTRY_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin \
            && BASE_DOMAIN='$BASE_DOMAIN' \
               IMAGE_WEB='$REG/web:$SHA' \
               IMAGE_API='$REG/api:$SHA' \
               IMAGE_API_MIGRATE='$REG/api-migrate:$SHA' \
               IMAGE_API_SEED='$REG/api-seed:$SHA' \
               POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
               BETTER_AUTH_SECRET='$BETTER_AUTH_SECRET' \
               BASIC_AUTH_USERS='$BASIC_AUTH_USERS' \
               bash deploy/bin/up.sh pr-$PR \
            && docker image prune -f"

      - name: Comment preview URL on the PR
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body "🚀 Preview environment: https://pr-${PR}.paceproductivity.app (updates on every push; torn down when this PR closes)."

  # Tear the PR's preview env down on close/merge: stop its containers and delete
  # its volumes (down -v). Runs only on close; the build jobs are skipped there.
  teardown-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Tear down preview over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key deploy@$DEPLOY_HOST"
          # down.sh is on the box from the preview deploy; removes the pr-<n> stack
          # + volumes. Idempotent — a no-op if the env never came up.
          $SSH "cd pace && bash deploy/bin/down.sh pr-$PR"

      - name: Comment teardown on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" \
            --body "🧹 Preview environment \`pr-${PR}\` torn down."

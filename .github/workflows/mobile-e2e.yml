name: Mobile E2E

# Runs the Maestro flows against a headless Android emulator. Building an APK +
# booting an emulator is slow, so this does NOT gate every push like the web and
# desktop suites. Instead it runs:
#   - on PRs touching the mobile app or the shared packages/deps it's built on
#     (see paths) — the changes that can break mobile while web + desktop stay
#     green: a shared client change, the single-React override, a Renovate bump;
#   - on demand from the Actions tab (workflow_dispatch).
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      # The backend the app talks to — its mobile-specific auth path (the expo()
      # plugin + expo-origin header) isn't exercised by the web/desktop suites.
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-e2e.yml"
      - ".github/scripts/mobile-e2e.sh"
  workflow_dispatch:

concurrency:
  # Per-ref so a new push to a PR cancels its own in-flight run; a manual
  # (workflow_dispatch) run is left to finish (only PR events cancel in progress).
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Postgres (:5433) + PowerSync (:8180) come from docker-compose.e2e.yml, started
    # in the "Start e2e infra" step below. P2-03 made task creation depend on the
    # seeded statuses syncing to the device, so the app needs a real PowerSync backend
    # — the same stack the Playwright/desktop suites use.
    env:
      DATABASE_URL: postgresql://pace:pace@localhost:5433/pace_test
      BETTER_AUTH_SECRET: ci-mobile-secret-not-used-in-prod
      BETTER_AUTH_URL: http://localhost:3001
      # PowerSync (in the compose) validates client JWTs against the API's JWKS. The
      # API runs on the host at :3001 (nitro dev's hardcoded port), so point the compose
      # there — it defaults to :3101 for the Playwright/desktop suites.
      API_PORT: "3001"
      # The emulator reaches the runner's host services via 10.0.2.2; baked into the
      # APK at build time. PowerSync is the e2e stack's service published on 8180.
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3001
      EXPO_PUBLIC_POWERSYNC_URL: http://10.0.2.2:8180
      # Permit cleartext http in the debug APK — CI only (see app.config.ts).
      PACE_ALLOW_CLEARTEXT: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Set up JDK (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile

      - name: Start e2e infra (Postgres + PowerSync)
        run: |
          docker compose -f docker-compose.e2e.yml up -d --wait
          # The API + PowerSync target pace_test (mirrors the Playwright global-setup);
          # create it on the compose Postgres before migrating. PowerSync retries its
          # replication connection until the DB + publication exist.
          docker compose -f docker-compose.e2e.yml exec -T postgres \
            psql -U pace -d pace -c "CREATE DATABASE pace_test"

      - name: Migrate database
        run: pnpm --filter @pace/api db:migrate

      - name: Start API (background, all interfaces)
        run: |
          pnpm --filter @pace/api dev > /tmp/api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            sleep 2
          done
          curl -sf http://localhost:3001/health || (echo "API failed to start"; cat /tmp/api.log; exit 1)

      # Build a standalone APK with Gradle directly — no EAS, no account, no
      # managed keystore. `expo prebuild` regenerates the native android/ project
      # from the Expo config (applying app.config.ts, so PACE_ALLOW_CLEARTEXT
      # takes effect). We build `release`, not `debug`: a debug APK loads its JS
      # from a Metro dev server (absent in CI), whereas release bundles the JS in.
      # The Expo template debug-signs the release build by default (see the
      # generated app/build.gradle: `signingConfig signingConfigs.debug`), so this
      # stays secret-free — debug signing is all an e2e smoke test needs.
      # android/ stays gitignored (regenerated each run).
      - name: Build APK (Gradle)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          ./android/gradlew -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pace-app.apk"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          # Single line: this action runs the script one line at a time (each as
          # its own `sh -c`), so the loop lives in a file. See the script header.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/mobile-e2e.sh"

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: ~/.maestro/tests/
          retention-days: 7

# Mobile Multiview (P2-07): the layout switcher flips list ⇄ board, and the board shows the shared
# tasks as cards under the default group's columns. Mirrors the web multiview.spec.ts switching +
# board-columns behaviours — native has no URL/persistence, so the layout is session state.
appId: app.paceproductivity.mobile
---
# Clean signed-out start (the session persists in secure-store).
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Welcome back"

# Sign up a fresh user so the board holds only this run's tasks.
- evalScript: ${output.email = 'maestro-mv-switch-' + Date.now() + '@pace.test'}
- tapOn: "Need an account? Sign up"
- assertVisible: "Create your account"
- tapOn:
    id: "name-input"
- inputText: "Maestro Multiview"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "supersecret123"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "signed-in"

# Add a task (Add is disabled until the seeded default status syncs down — wait for it).
- tapOn:
    id: "task-input"
- inputText: "Alpha"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "add-task"
      enabled: true
    timeout: 45000
- tapOn:
    id: "add-task"
- assertVisible: "Alpha"

# Board: the default group seeds a To Do (open) and a Done column; the new task is a card.
- tapOn:
    id: "layout-board"
- assertVisible: "To Do"
- assertVisible: "Done"
- assertVisible: "Alpha"

# Switch back to the list — the same task is there.
- tapOn:
    id: "layout-list"
- assertVisible: "Alpha"

# Mobile auth happy path: sign up -> signed in -> sign out.
# Run: maestro test apps/mobile/.maestro/sign-up.yaml  (device/emulator with the
# dev build installed + Metro running; the app must reach the API — see README).
appId: app.paceproductivity.mobile
---
# Reach a clean signed-out start — the session persists in secure-store, so a
# prior run (or a manual login) can leave the app signed in. (Dev build: we drive
# the foreground app rather than launchApp, which lands on the dev-client launcher.
# A preview/standalone build could use `- launchApp: { clearState: true }` instead.)
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Welcome back"

# Unique email per run so repeated runs don't collide.
- evalScript: ${output.email = 'maestro-' + Date.now() + '@pace.test'}

# Switch to sign-up and register. The toggle resets the form, so fields start
# empty even when flows run back-to-back against one long-lived app instance.
- tapOn: "Need an account? Sign up"
- assertVisible: "Create your account"
- tapOn:
    id: "name-input"
- inputText: "Maestro User"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "Supersecret123!"
# Dismiss the keyboard so it isn't covering the submit button.
- hideKeyboard
- tapOn:
    id: "submit-button"

# Landed on the signed-in home.
- assertVisible:
    id: "signed-in"

# Sign out returns to the auth screen.
- tapOn:
    id: "sign-out"
- assertVisible: "Welcome back"

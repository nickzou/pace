# Mobile negative: a wrong password is rejected and shows an error.
# Registers a fresh account, signs out, then attempts sign-in with a bad password.
appId: app.paceproductivity.mobile
---
# Reach a clean signed-out start — the session persists in secure-store, so a
# prior run (or a manual login) can leave the app signed in.
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Welcome back"
- evalScript: ${output.email = 'maestro-neg-' + Date.now() + '@pace.test'}

# Create the account. The mode toggle resets the form, so fields start empty even
# when flows run back-to-back against one long-lived app instance.
- tapOn: "Need an account? Sign up"
- tapOn:
    id: "name-input"
- inputText: "Neg User"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "Supersecret123!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "signed-in"

# Sign out, then try the wrong password.
- tapOn:
    id: "sign-out"
- assertVisible: "Welcome back"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "not-the-password"
- hideKeyboard
- tapOn:
    id: "submit-button"

# Error shows; we stay on the auth screen (not signed in).
- assertVisible:
    id: "auth-error"

# Mobile scheduling flow: sign up -> add a task -> open the unified Schedule control -> set a due
# date via a preset -> add/clear a time -> set it to repeat -> confirm it persists -> clear it.
#
# Parity note: scheduling is now one control (DateRangeField) — a button that opens a modal with a
# range calendar, quick-date presets, per-end times, and the Repeat control (matches the web flow).
# Maestro can't drive the range calendar or the native OS time picker to a *specific* value, so we
# set dates via the deterministic PRESET chips and assert UI STATE: the trigger's placeholder ("Set
# date") disappearing, the has_time flag (the time-clear affordance), the repeat summary, and that
# the schedule survives closing/reopening the detail (read back from local SQLite).
appId: app.paceproductivity.mobile
---
# Reach a clean signed-out start — the session persists in secure-store.
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Welcome back"

# Sign up a fresh user (unique email per run).
- evalScript: ${output.email = 'maestro-sched-' + Date.now() + '@pace.test'}
- tapOn: "Need an account? Sign up"
- assertVisible: "Create your account"
- tapOn:
    id: "name-input"
- inputText: "Maestro Scheduling"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "Supersecret123!"
- tapOn:
    id: "confirm-password-input"
- inputText: "Supersecret123!"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "signed-in"

# Add a task and open its detail.
- evalScript: ${output.task = 'Schedule me ' + Date.now()}
- tapOn:
    id: "task-input"
- inputText: ${output.task}
- hideKeyboard
# Add is disabled until the seeded default status syncs down (P2-03) — wait for it to
# enable so the tap actually creates the task instead of silently no-op'ing.
- extendedWaitUntil:
    visible:
      id: "add-task"
      enabled: true
    timeout: 45000
- tapOn:
    id: "add-task"
- assertVisible: ${output.task}
- tapOn:
    id: "open-.*"

# The schedule starts unset.
- assertVisible: "Set date"

# Open the Schedule control (auto-selects today) and pick a due date via the Tomorrow preset.
- tapOn:
    id: "detail-schedule"
- tapOn:
    id: "due-preset-tomorrow"

# Add a time — accept the native time picker's default via OK. The time-clear affordance appears.
- tapOn:
    id: "detail-due-time"
- tapOn: "OK"
- assertVisible:
    id: "detail-due-time-clear"

# Clear just the time → back to date-only (the time-clear affordance is gone).
- tapOn:
    id: "detail-due-time-clear"
- assertNotVisible:
    id: "detail-due-time-clear"

# Make it repeat weekly — the Repeat control sits below the calendar in the modal, so scroll to it.
# Selecting a frequency reveals the on-completion chips (regen-*), confirming a rule is set.
- scrollUntilVisible:
    element:
      id: "repeat-weekly"
    direction: DOWN
- tapOn:
    id: "repeat-weekly"
- scrollUntilVisible:
    element:
      id: "regen-advance"
    direction: DOWN

# Close the modal — a due date is now set, so the "Set date" placeholder is gone.
- scrollUntilVisible:
    element:
      id: "detail-schedule-done"
    direction: DOWN
- tapOn:
    id: "detail-schedule-done"
- assertNotVisible: "Set date"

# The schedule persists across closing + reopening the detail (read from local SQLite).
- tapOn:
    id: "detail-close"
- tapOn:
    id: "open-.*"
- assertNotVisible: "Set date"

# Clear the whole schedule → back to unset. Clear sits at the bottom of the modal, so scroll to it.
- tapOn:
    id: "detail-schedule"
- scrollUntilVisible:
    element:
      id: "detail-clear"
    direction: DOWN
- tapOn:
    id: "detail-clear"
- assertVisible: "Set date"

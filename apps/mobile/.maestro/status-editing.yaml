# Mobile · P2-03 status polish. Recolour + rename a status, add + rename a status list,
# then close/reopen Settings to prove the edits round-tripped through PowerSync (read back
# from local SQLite), not just optimistic UI. Mirrors the web status-editing.spec.ts.
appId: app.paceproductivity.mobile
---
# Clean signed-out start — the session persists in secure-store.
- runFlow:
    when:
      visible:
        id: "sign-out"
    commands:
      - tapOn:
          id: "sign-out"
- assertVisible: "Welcome back"

# Sign up a fresh user (unique email per run).
- evalScript: ${output.email = 'maestro-statusedit-' + Date.now() + '@pace.test'}
- tapOn: "Need an account? Sign up"
- assertVisible: "Create your account"
- tapOn:
    id: "name-input"
- inputText: "Maestro StatusEdit"
- tapOn:
    id: "email-input"
- inputText: ${output.email}
- tapOn:
    id: "password-input"
- inputText: "supersecret123"
- hideKeyboard
- tapOn:
    id: "submit-button"
- assertVisible:
    id: "signed-in"

# Open Settings and enable custom statuses. The toggle is disabled until user_settings
# syncs down (P2-03) — wait for it to enable so the tap actually toggles.
- tapOn:
    id: "settings-open"
- extendedWaitUntil:
    visible:
      id: "statuses-toggle"
      enabled: true
    timeout: 45000
# Enable custom statuses. A fresh signup starts OFF, and the app now holds the toggle ON optimistically
# through the cold-sync window (see status-settings.tsx), so a plain tap sticks — no parity guard, which
# previously skipped the tap when the section hadn't rendered its hint yet right after opening Settings.
- tapOn:
    id: "statuses-toggle"
# add-status-input lives inside a group block that only renders once the seeded default status_groups
# COLD-SYNC down — under parallel CI load that latency is large (seen ~60s). Wait for it with a single,
# long-timeout scroll: retry() caps its own total near ~90s, but a lone scrollUntilVisible honours its
# full timeout. ~180s of patience outlasts the slow-CI default-group sync. Then add a status.
- scrollUntilVisible:
    element:
      id: "add-status-input"
    direction: DOWN
    timeout: 180000
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "add-status-input"
    waitToSettleTimeoutMs: 2000
- inputText: "QA"
- hideKeyboard
- tapOn:
    id: "add-status-btn"
- assertVisible:
    id: "status-name-QA"

# Recolour it: open its picker and pick blue (the recolorStatus path — the gap this fixes).
- tapOn:
    id: "status-color-QA"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "status-swatch-blue"

# Rename it QA -> QAdone. The name input saves on blur, so tap the section heading to blur.
- tapOn:
    id: "status-name-QA"
- eraseText: 12
- inputText: "QAdone"
- tapOn: "Statuses"
- assertVisible:
    id: "status-name-QAdone"

# Add a status list and rename it Sprint -> Sprint2 (the previously-unreachable capability).
- tapOn:
    id: "new-group-input"
- inputText: "Sprint"
- hideKeyboard
- tapOn:
    id: "new-group-btn"
- assertVisible:
    id: "group-name-Sprint"
- tapOn:
    id: "group-name-Sprint"
- eraseText: 12
- inputText: "Sprint2"
- tapOn: "Statuses"
- assertVisible:
    id: "group-name-Sprint2"

# Persistence: close + reopen Settings, then scroll back to the statuses section. The
# renamed status and list are read from local SQLite, proving the edits reached Postgres
# and synced down — not just optimistic UI. (settings-close sits at the top of the modal,
# scrolled off after all the edits, and reopening lands at the top — hence the scrolls.)
- scrollUntilVisible:
    element:
      id: "settings-close"
    direction: UP
- tapOn:
    id: "settings-close"
- tapOn:
    id: "settings-open"
# Reopening remounts the section, so the optimistic override resets and the toggle reflects the local
# DB — which can still read disabled if the enable hasn't converged server→client under CI load. Scroll
# the toggle into view and re-enable if the off-hint shows (sticky again for this mount) so the persisted
# QAdone/Sprint2 rows are on screen. Parity-safe: only taps while disabled, and the section is rendered
# first (so the hint check can't race an un-rendered section as it did right after opening Settings).
- scrollUntilVisible:
    element:
      id: "statuses-toggle"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible: "Turn this on"
    commands:
      - tapOn:
          id: "statuses-toggle"
- scrollUntilVisible:
    element:
      id: "status-name-QAdone"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      id: "group-name-Sprint2"
    direction: DOWN
    timeout: 60000
    waitToSettleTimeoutMs: 1000
